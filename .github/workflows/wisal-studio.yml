name: Wisal Studio checks

# فحص نسخة الويب: اختبارات محرّك التأليف (محلي بالكامل، من غير شبكة) + بناء
# الإنتاج. بيتشغّل مع أي تعديل في المجلد.
on:
  workflow_dispatch:
  push:
    branches:
      - claude/telegram-ai-assistant-bot-8vqsfg
      - main
    paths:
      - "wisal-studio/**"
      - ".github/workflows/wisal-studio.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wisal-studio
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: npm install

      - name: Engine tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Dependency audit
        run: npm audit --audit-level=high
