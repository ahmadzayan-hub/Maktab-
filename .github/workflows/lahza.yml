name: Lahza checks

# فحص تطبيق Lahza (جذر الريبو، Vite + React + TypeScript): فحص الأنواع + بناء
# الإنتاج. بيتشغّل مع أي تعديل في مصادر التطبيق أو إعداداته، ويتجاهل المجلدات
# الفرعية للمشاريع التانية (ليها workflows بتاعتها).
on:
  workflow_dispatch:
  push:
    branches:
      - claude/telegram-ai-assistant-bot-8vqsfg
      - main
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "vite.config.*"
      - "tailwind.config.*"
      - "postcss.config.*"
      - ".github/workflows/lahza.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
