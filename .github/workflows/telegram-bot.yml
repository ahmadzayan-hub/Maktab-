name: Telegram bot checks

# فحص بوت telegram-wife-assistant: الاختبارات (حارس المالك، الاقتراحات،
# التعلّم بالسياق، الجدولة) + npm audit. بيتشغّل مع أي تعديل في المجلد.
on:
  workflow_dispatch:
  push:
    branches:
      - claude/telegram-ai-assistant-bot-8vqsfg
      - main
    paths:
      - "telegram-wife-assistant/**"
      - ".github/workflows/telegram-bot.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: telegram-wife-assistant
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: telegram-wife-assistant/package-lock.json

      - name: Install
        run: npm ci

      - name: Tests
        run: npm test

      - name: Dependency audit
        run: npm audit --audit-level=high
