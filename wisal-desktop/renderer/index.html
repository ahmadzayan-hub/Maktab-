<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:; connect-src https://api.groq.com">
  <title>وصال — Wisal OS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <!-- شريط الوحدات (Agentic OS modules) -->
    <aside class="sidebar">
      <div class="brand"><span class="logo">💗</span> <b>وصال</b> <span class="os-tag">OS</span></div>
      <nav id="nav">
        <button class="nav-item active" data-view="home"><span>🤖 Agents</span><span class="k">Ctrl 1</span></button>
        <button class="nav-item" data-view="skills"><span>🧩 Skills</span><span class="k">Ctrl 2</span></button>
        <button class="nav-item" data-view="tools"><span>🔧 Tools</span><span class="k">Ctrl 3</span></button>
        <button class="nav-item" data-view="broadcast"><span>📣 Groups</span><span class="k">Ctrl 4</span></button>
        <button class="nav-item" data-view="people"><span>🧠 Brain</span><span class="k">Ctrl 5</span></button>
        <button class="nav-item" data-view="history"><span>🗄️ Memory</span><span class="k">Ctrl 6</span></button>
        <button class="nav-item" data-view="settings"><span>✨ LLM</span><span class="k">Ctrl 7</span></button>
      </nav>
      <div class="side-foot">
        <div id="whoBadge" class="who-badge"></div>
        <div class="row tight">
          <button id="themeBtn" class="ghost small grow">🌓 الثيم</button>
          <button id="scBtn" class="ghost small" title="اختصارات الكيبورد (؟)">⌨️</button>
        </div>
      </div>
    </aside>

    <!-- المحتوى -->
    <main class="content">
      <div id="statusbar" class="statusbar"></div>
      <section id="view-home" class="view"></section>
      <section id="view-skills" class="view hidden"></section>
      <section id="view-tools" class="view hidden"></section>
      <section id="view-broadcast" class="view hidden"></section>
      <section id="view-people" class="view hidden"></section>
      <section id="view-history" class="view hidden"></section>
      <section id="view-settings" class="view hidden"></section>
      <section id="view-onboard" class="view hidden"></section>
    </main>
  </div>

  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-head"><b id="modalTitle"></b><button id="modalClose" class="ghost small">✕</button></div>
      <div id="modalBody" class="modal-body"></div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="renderer.js"></script>
</body>
</html>
